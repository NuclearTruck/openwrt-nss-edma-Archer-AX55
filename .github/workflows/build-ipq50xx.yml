name: Build ipq50xx (AX55 v1)

# Trimmed fork of kuncy7/openwrt-nss-edma build-ipq50xx.yml:
#   - one memory group only (GROUP below), no matrix
#   - uploads sysupgrade + factory/initramfs images of the AX55 v1 if they were built
#   - kmod repository is published to gh-pages as before
#
# Board list / extra kmods: .github/ci/ipq50xx/*.config (std.config, kmods-extra.config)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = ArcherAX55v1-YYYY.MM.DD, UTC date)"
        required: false
        type: string

concurrency:
  group: build-ipq50xx
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET: qualcommax/ipq50xx
  RELEASE_PREFIX: ArcherAX55v1
  GROUP: std                     # <-- which config group holds the AX55 v1 (std or 256m)
  BOARD: tplink_archer-ax55-v1   # <-- name as it appears in the image file names
  KEEP: "3"
  TAG_RE: '^ArcherAX55v1-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$'
  CI_DIR: .github/ci/ipq50xx
  PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  release:
    name: Create draft release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.tag }}
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: draft
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            base="${RELEASE_PREFIX}-$(date -u +%Y.%m.%d)"
            tag="$base"; n=2
            while gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
                  || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; do
              tag="${base}-${n}"; n=$((n+1))
            done
          fi
          {
            echo "NSS offload build for ${BOARD} (\`${TARGET}\`), built from \`${GITHUB_SHA::12}\`."
            echo
            echo "Extra kernel modules are not in the image:"
            echo "\`apk update && apk add kmod-<name>\` fetches them from this build's own repository:"
            echo "\`${PAGES_BASE}/${tag}/${GROUP}/packages.adb\`."
            echo "Kernel modules only install on an image from the same build."
          } >release_notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$tag" --notes-file release_notes.md >&2
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ github.event.repository.name }}
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update || true
          sudo apt-get install -y bzip2 g++ gawk gcc git glibc-source libncurses-dev make rsync

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Feeds
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Package repositories for the image
        run: |
          set -euo pipefail
          mkdir -p files/etc/apk/repositories.d
          {
            echo "${PAGES_BASE}/${TAG}/${GROUP}/packages.adb"
            for f in base luci packages routing telephony video; do
              echo "https://downloads.openwrt.org/snapshots/packages/aarch64_cortex-a53/${f}/packages.adb"
            done
          } >files/etc/apk/repositories.d/distfeeds.list
          cat files/etc/apk/repositories.d/distfeeds.list

      - name: Assemble .config
        run: |
          set -euo pipefail
          frags=("${CI_DIR}/common.config" "${CI_DIR}/${GROUP}.config" "${CI_DIR}/kmods-extra.config")
          cat "${frags[@]}" >.config
          make defconfig
          # defconfig drops a symbol it cannot select without a word; here that is an error
          dropped=()
          while IFS= read -r req; do
            grep -qxF "$req" .config || dropped+=("$req")
          done < <(cat "${frags[@]}" | grep -E '^CONFIG_[A-Za-z0-9_-]+=' | sort -u)
          if [[ ${#dropped[@]} -gt 0 ]]; then
            printf '::error::defconfig dropped %s\n' "${dropped[@]}"
            exit 1
          fi
          python3 - <<'PY'
          import os, re, sys
          cfg = open('.config').read()
          boards = set(re.findall(r'^CONFIG_TARGET_DEVICE_qualcommax_ipq50xx_DEVICE_([^=]+)=y', cfg, re.M))
          built = set(re.findall(r'^CONFIG_PACKAGE_([^=]+)=[ym]', cfg, re.M))
          path = 'tmp/info/.targetinfo-qualcommax'
          info = open(path if os.path.exists(path) else 'tmp/.targetinfo').read()
          bad = 0
          for blk in info.split('Target-Profile: DEVICE_')[1:]:
              name = blk.split('\n', 1)[0].strip()
              if name not in boards:
                  continue
              m = re.search(r'^Target-Profile-Packages:(.*)$', blk, re.M)
              for pkg in (m.group(1).split() if m else []):
                  if not pkg.startswith('-') and pkg not in built:
                      print(f'::error::{name}: device package {pkg} is not selected')
                      bad = 1
          sys.exit(bad)
          PY
          ./scripts/diffconfig.sh >"diffconfig-${GROUP}.txt"

      - name: Restore source archives
        id: dl-restore
        uses: actions/cache/restore@v6
        with:
          path: dl
          key: dl-ipq50xx-${{ env.GROUP }}-none
          restore-keys: |
            dl-ipq50xx-${{ env.GROUP }}-
            dl-ipq50xx-

      - name: Download sources
        timeout-minutes: 75
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 60
          CURL_OPTIONS: --speed-limit 1000 --speed-time 60
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if timeout --kill-after=60 20m make download -j"$(nproc)"; then
              ok=1
              break
            fi
            echo "::warning::download attempt $attempt failed or ran into the 20 minute limit"
            find dl -maxdepth 1 -name '*.dl' -printf '::warning::unfinished download: %f (%s bytes)\n' || true
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::the sources could not be downloaded in three attempts"
            exit 1
          fi

      - name: Compute source archive key
        id: dl-key
        run: |
          set -euo pipefail
          sum=$(find dl/ -maxdepth 1 -type f ! -name '*.dl' ! -name '*.hash' -printf '%f %s\n' | LC_ALL=C sort | sha256sum | cut -c1-16)
          echo "key=dl-ipq50xx-${GROUP}-${sum}" >>"$GITHUB_OUTPUT"
          echo "dl/: $(du -sh dl/ | cut -f1), restored from: ${{ steps.dl-restore.outputs.cache-matched-key || 'nothing' }}"

      - name: Save source archives
        if: steps.dl-key.outputs.key != steps.dl-restore.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: dl
          key: ${{ steps.dl-key.outputs.key }}

      - name: Compute ccache key
        id: ccache
        run: |
          set -euo pipefail
          tree=$(git rev-parse HEAD:toolchain)
          sum=$({ echo "$tree"; grep -E '^CONFIG_(BINUTILS|GCC|LIBC|MUSL)_' .config; gcc --version; as --version; } \
                | sha256sum | cut -c1-16)
          echo "prefix=ccache-ipq50xx-${GROUP}-${sum}-" >>"$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.ccache.outputs.prefix }}

      - name: Build
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 4G
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)"; then
            make -j1 V=s 2>&1 | tail -300
            exit 1
          fi
          CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -s || true
          df -h / | tail -1

      - name: Add luci-app-nss and wpad-mesh-mbedtls to the build's repository
        run: |
          set -euo pipefail
          cp bin/packages/*/base/luci-app-nss-*.apk "bin/targets/${TARGET}/packages/"
          for f in bin/packages/*/base/luci-i18n-nss-*.apk; do [ -e "$f" ] && cp "$f" "bin/targets/${TARGET}/packages/"; done
          if grep -q '^CONFIG_PACKAGE_wpad-mesh-mbedtls=[my]' .config; then
            cp bin/packages/*/base/wpad-mesh-mbedtls-*.apk "bin/targets/${TARGET}/packages/"
          fi
          make package/index

      - name: Check the output
        run: |
          set -euo pipefail
          out="bin/targets/${TARGET}"
          echo "--- files in ${out} ---"
          ls -la "$out"
          n_img=$(find "$out" -maxdepth 1 -name 'openwrt-*-squashfs-sysupgrade.bin' | wc -l)
          n_dev=$(grep -c '^CONFIG_TARGET_DEVICE_.*=y' .config)
          echo "sysupgrade images: $n_img of $n_dev boards"
          [[ "$n_img" -eq "$n_dev" ]] || { echo "::error::$n_img images for $n_dev boards"; exit 1; }
          [[ -f "$out/packages/packages.adb" ]] || { echo "::error::no package index"; exit 1; }
          compgen -G "$out/packages/kmod-wireguard-*.apk" >/dev/null \
            || { echo "::error::kmod-wireguard missing from the repository"; exit 1; }
          compgen -G "$out/packages/luci-app-nss-*.apk" >/dev/null \
            || { echo "::error::luci-app-nss missing from the repository"; exit 1; }
          n_po=$(find package/nss/luci-app-nss/po -mindepth 1 -maxdepth 1 -type d ! -name templates | wc -l)
          n_i18n=$(find "$out/packages" -maxdepth 1 -name 'luci-i18n-nss-*.apk' | wc -l)
          echo "luci-app-nss translations: $n_i18n packages for $n_po in the tree"
          [[ "$n_i18n" -eq "$n_po" ]] \
            || { echo "::error::$n_i18n luci-i18n-nss packages for $n_po translations (CONFIG_LUCI_LANG_<lang>=m in kmods-extra.config?)"; exit 1; }
          if grep -q '^CONFIG_PACKAGE_wpad-mesh-mbedtls=[my]' .config; then
            compgen -G "$out/packages/wpad-mesh-mbedtls-*.apk" >/dev/null \
              || { echo "::error::wpad-mesh-mbedtls missing from the repository"; exit 1; }
          fi
          # your extra kmod must have been built
          compgen -G "$out/packages/kmod-nf-conntrack-netlink-*.apk" >/dev/null \
            || { echo "::error::kmod-nf-conntrack-netlink missing from the repository"; exit 1; }
          kernel=$(find "$out/packages" -maxdepth 1 -name 'kernel-*.apk' -printf '%f\n')
          echo "repository: $(find "$out/packages" -maxdepth 1 -name '*.apk' | wc -l) packages, ${kernel}"

      - name: Upload images to the draft release
        run: |
          set -euo pipefail
          out="bin/targets/${TARGET}"
          # sysupgrade always; factory and initramfs images of this board only if they were built
          mapfile -t assets < <(find "$out" -maxdepth 1 -type f \( \
              -name 'openwrt-*-squashfs-sysupgrade.bin' \
              -o -name "openwrt-*-${BOARD}-*factory*" \
              -o -name "openwrt-*-${BOARD}-*initramfs*" \) | sort)
          printf 'uploading: %s\n' "${assets[@]}"
          : >"sha256sums-${GROUP}.txt"
          for a in "${assets[@]}"; do
            grep -F "$(basename "$a")" "$out/sha256sums" >>"sha256sums-${GROUP}.txt" || true
          done
          cp "$out/config.buildinfo" "config-${GROUP}.buildinfo"
          ./scripts/feeds list -fs >"feeds-${GROUP}.buildinfo"
          cat "feeds-${GROUP}.buildinfo"
          for attempt in 1 2 3; do
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "${assets[@]}" "sha256sums-${GROUP}.txt" "config-${GROUP}.buildinfo" \
              "feeds-${GROUP}.buildinfo" "diffconfig-${GROUP}.txt" && break
            [[ $attempt -lt 3 ]] || { echo "::error::upload failed after $attempt attempts"; exit 1; }
            sleep 15
          done
          {
            echo "## ${GROUP}"
            echo "- images: ${#assets[@]}"
            echo "- repository: $(find "$out/packages" -maxdepth 1 -name '*.apk' | wc -l) packages"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the package repository for the pages job
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.GROUP }}
          path: bin/targets/${{ env.TARGET }}/packages/
          retention-days: 3
          if-no-files-found: error

  pages:
    name: Publish kmod repository
    needs: [release, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Check out gh-pages
        run: |
          set -euo pipefail
          git init -q site
          cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null; then
            git checkout -q -b gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: site/${{ needs.release.outputs.tag }}

      - name: Arrange, prune, push
        run: |
          set -euo pipefail
          cd site
          for d in "${TAG}"/packages-*; do mv "$d" "${TAG}/${d##*/packages-}"; done
          [[ -f "${TAG}/${GROUP}/packages.adb" ]] || { echo "::error::${TAG}/${GROUP} has no package index"; exit 1; }
          mapfile -t dirs < <(find . -maxdepth 1 -type d -printf '%f\n' | grep -E "$TAG_RE" | sort -r)
          for old in "${dirs[@]:${KEEP}}"; do
            echo "prune $old"
            rm -rf "$old"
          done
          {
            echo "# Kernel module repositories"
            echo
            echo "One directory per build of \`${GITHUB_REPOSITORY}\`."
            echo "An image lists its own; kernel modules only install on an image from the same build."
            echo
            for t in $(find . -maxdepth 1 -type d -printf '%f\n' | grep -E "$TAG_RE" | sort -r); do
              echo "- ${t}: [${GROUP}](${t}/${GROUP}/packages.adb)," \
                "[release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${t})"
            done
          } >index.md
          touch .nojekyll
          git checkout -q --orphan gh-pages-new
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -qm "kernel module repository, newest ${TAG}"
          git push -q --force origin gh-pages-new:gh-pages

  publish:
    name: Publish release
    needs: [release, build, pages]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      BUILD_RESULT: ${{ needs.build.result }}
      PAGES_RESULT: ${{ needs.pages.result }}
    steps:
      - name: Publish or discard
        run: |
          set -euo pipefail
          if [[ "$BUILD_RESULT" != "success" || "$PAGES_RESULT" != "success" ]]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "::error::build=$BUILD_RESULT pages=$PAGES_RESULT; draft release discarded"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Prune old releases
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --json tagName,publishedAt \
            | jq -r --arg re "$TAG_RE" --argjson keep "$KEEP" \
                '[.[] | select(.tagName | test($re))] | sort_by(.publishedAt) | reverse | .[$keep:][] | .tagName' \
            | while read -r old; do
                echo "delete release $old"
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
